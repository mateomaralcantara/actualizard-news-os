services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: actualizard
      POSTGRES_USER: actualizard
      POSTGRES_PASSWORD: actualizard
    ports:
      - "5432:5432"
    volumes:
      - actualizard_pg:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

volumes:
  actualizard_pg:
